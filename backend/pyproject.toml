[project]
name = "contractor-requests-backend"
version = "0.8.0"
description = "Backend for Contractor Requests"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "fastapi[standard]>=0.115.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
